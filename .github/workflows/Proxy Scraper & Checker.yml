name: Proxy Scraper & Checker

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Choose operation to run'
        required: true
        type: choice
        default: 'scrape_only'
        options:
          - 'scrape_only'
          - 'check_only'
          - 'scrape_and_check'
      workers:
        description: 'Number of workers for proxy checking (default: 128)'
        required: false
        type: number
        default: 128
      commit_changes:
        description: 'Commit and push changes to repository'
        required: true
        type: boolean
        default: true
  
  schedule:
    - cron: '0 */3 * * *'

env:
  PYTHON_VERSION: '3.11'

jobs:
  proxy-operations:
    runs-on: ubuntu-latest
    
    steps:
      - name: Optimized Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            *.py
            requirements.txt
            .github/
            *.txt
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests rich pysocks
          fi

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git config --local core.autocrlf false
          git config --local advice.updateSparsePath false

      - name: Run Proxy Scraper
        if: ${{ inputs.operation == 'scrape_only' || inputs.operation == 'scrape_and_check' || github.event_name == 'schedule' }}
        run: |
          echo "🔍 Starting proxy scraping..."
          python getproxy.py
          echo "✅ Proxy scraping completed"

      - name: Run Proxy Checker
        if: ${{ inputs.operation == 'check_only' || inputs.operation == 'scrape_and_check' }}
        run: |
          echo "🔧 Starting proxy checking with ${{ inputs.workers || 128 }} workers..."
          python checkproxy.py ${{ inputs.workers || 128 }}
          echo "✅ Proxy checking completed"

      - name: Update Sparse Checkout for Generated Files
        if: ${{ (inputs.commit_changes != false && github.event_name == 'workflow_dispatch') || github.event_name == 'schedule' }}
        run: |
          echo "📝 Adding generated files to sparse-checkout..."
          # Add any newly generated txt files to sparse checkout
          for file in *.txt; do
            if [[ -f "$file" ]]; then
              git sparse-checkout add "$file" 2>/dev/null || true
            fi
          done
          git sparse-checkout reapply

      - name: Display Results Summary
        run: |
          echo "📊 Operation Summary:"
          echo "Operation: ${{ inputs.operation || 'scrape_only (scheduled)' }}"
          
          total_proxies=0
          for file in *.txt; do
            if [[ -f "$file" && "$file" != "requirements.txt" ]]; then
              lines=$(wc -l < "$file" 2>/dev/null || echo "0")
              size=$(du -h "$file" | cut -f1)
              echo "📄 $file: $lines proxies ($size)"
              total_proxies=$((total_proxies + lines))
            fi
          done
          echo "🎯 Total proxies: $total_proxies"

      - name: Commit and Push Changes
        if: ${{ (inputs.commit_changes != false && github.event_name == 'workflow_dispatch') || github.event_name == 'schedule' }}
        run: |
          if [[ -n $(git status --porcelain "*.txt") ]]; then
            echo "📝 Committing proxy files..."
            
            # Use --sparse flag to add files outside sparse-checkout
            git add --sparse *.txt
            
            if [[ "${{ inputs.operation }}" == "scrape_only" || "${{ github.event_name }}" == "schedule" ]]; then
              commit_msg="🔍 Update proxies - Scraping completed"
            elif [[ "${{ inputs.operation }}" == "check_only" ]]; then
              commit_msg="🔧 Update proxies - Checking completed (${{ inputs.workers || 128 }} workers)"
            else
              commit_msg="🚀 Update proxies - Scraping & Checking completed (${{ inputs.workers || 128 }} workers)"
            fi
            
            commit_msg="$commit_msg ($(date '+%Y-%m-%d %H:%M UTC'))"
            git commit -m "$commit_msg"
            
            echo "📤 Pushing changes..."
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Changes pushed successfully"
          else
            echo "ℹ️ No proxy files to commit"
          fi
